<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Notification Management</title>

    <link rel="stylesheet" href="/admin/css/base.css">
    <link rel="stylesheet" href="/admin/css/notifications.css">

    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; border-bottom: 1px solid #ddd; }
        textarea { width: 100%; height: 60px; }
        input, select { width: 100%; }
        button { margin-right: 5px; }
        .danger { color: red; }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .modal-content {
            background: #fff;
            width: 420px;
            margin: 8% auto;
            padding: 20px;
            border-radius: 8px;
        }

        .modal-content label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        .modal-content input,
        .modal-content textarea,
        .modal-content select {
            width: 100%;
            margin-top: 5px;
        }

        .modal-actions {
            margin-top: 15px;
            text-align: right;
        }

        .close {
            float: right;
            font-size: 22px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>ADMIN</h2>
    <a href="/admin/home">Dashboard</a>
    <a href="/admin/users">Users</a>
    <a href="/admin/doctors">Doctors</a>
    <a href="/admin/clinics">Clinics</a>
    <a href="/admin/packages">Packages</a>
    <a href="/admin/ai">AI Management</a>
    <a href="/admin/notifications" class="active">Notifications</a>
    <a href="/admin/reports">Reports</a>
</div>

<div class="main">
    <h1>Notification Management</h1>

    <button onclick="openModal()">+ Add Notification</button>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>User ID</th>
            <th>User Name</th>
            <th>Title</th>
            <th>Message</th>
            <th>Type</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="notificationTable"></tbody>
    </table>
</div>

<!-- ================= MODAL ================= -->
<div id="notificationModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>

        <h3>📢 Tạo Notification</h3>

        <label>User</label>
        <select id="modalUserSelect"></select>

        <label>Title</label>
        <input type="text" id="modalTitle">

        <label>Message</label>
        <textarea id="modalMessage"></textarea>

        <label>Type</label>
        <select id="modalType">
            <option value="INFO">INFO</option>
            <option value="SUCCESS">SUCCESS</option>
            <option value="WARNING">WARNING</option>
            <option value="CRITICAL">CRITICAL</option>
        </select>

        <div class="modal-actions">
            <button onclick="submitNotification()">📤 Gửi</button>
            <button class="danger" onclick="closeModal()">Hủy</button>
        </div>
    </div>
</div>

<script src="/admin/js/notifications.js"></script>
</body>
</html>
