<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Service Packages</title>

    <link rel="stylesheet" href="/admin/css/base.css">
    <link rel="stylesheet" href="/admin/css/packages.css">

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        input {
            width: 100%;
            padding: 4px;
        }

        button {
            padding: 6px 10px;
            cursor: pointer;
        }

        .danger {
            color: red;
        }

        /* ===== SWITCH ===== */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            background-color: #ccc;
            border-radius: 24px;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            transition: 0.3s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked + .slider {
            background-color: #4CAF50;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>ADMIN</h2>
    <a href="/admin/home">Dashboard</a>
    <a href="/admin/users">Users</a>
    <a href="/admin/doctors">Doctors</a>
    <a href="/admin/clinics">Clinics</a>
    <a href="/admin/packages" class="active">Packages</a>
    <a href="/admin/ai">AI Management</a>
    <a href="/admin/notifications">Notifications</a>
</div>

<div class="main">
    <h1>Service Packages</h1>

    <button onclick="addPackage()">+ Add Package</button>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Package Name</th>
            <th>Price</th>
            <th>Period</th>
            <th>Features</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="packageTableBody">
        <!-- JS render -->
        </tbody>
    </table>
</div>

<script src="/admin/js/packages.js"></script>
</body>
</html>
