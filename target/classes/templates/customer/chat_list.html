<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Danh sách Bác sĩ - AURA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        }

        body {
            background: #f0f2f5;
            font-family: 'Inter', sans-serif;
        }

        .hero-section {
            background: var(--primary-gradient);
            color: white;
            padding: 40px 0;
            border-radius: 0 0 40px 40px;
            margin-bottom: 30px;
        }

        .doctor-card {
            border: none;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
            background: white;
        }

        .doctor-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .doctor-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .status-online {
            width: 12px;
            height: 12px;
            background: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <div class="hero-section text-center">
        <div class="container text-start">
            <a th:href="@{/customer/home}" class="text-white text-decoration-none mb-3 d-inline-block">
                <i class="fas fa-arrow-left me-2"></i> Quay lại
            </a>
            <h1 class="fw-bold">Tư vấn trực tuyến</h1>
            <p class="opacity-75">Kết nối nhanh chóng với các bác sĩ chuyên khoa hàng đầu.</p>
        </div>
    </div>

    <div class="container">
        <div class="row g-4">
            <div class="col-md-4" th:each="doc : ${doctors}">
                <div class="doctor-card p-4 text-center"
                    th:onclick="'window.location.href=\'/customer/chat/' + ${doc.id} + '\''">
                    <img th:src="${doc.avatarPath != null ? doc.avatarPath : 'https://cdn-icons-png.flaticon.com/512/3774/3774299.png'}"
                        class="doctor-avatar mb-3">
                    <h5 class="fw-bold text-dark mb-1" th:text="${doc.fullName}">Bác sĩ Chi Thanh</h5>
                    <p class="text-primary small fw-semibold mb-3">
                        <span class="status-online"></span> Sẵn sàng tư vấn
                    </p>
                    <p class="text-muted small mb-4"
                        th:text="${doc.specialist != null ? doc.specialist : 'Chuyên gia Võng mạc'}">Chuyên khoa Mắt -
                        10 năm kinh nghiệm</p>
                    <button class="btn btn-primary rounded-pill w-100 fw-bold">NHẮN TIN NGAY</button>
                </div>
            </div>

            <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(doctors)}">
                <i class="fas fa-user-md fa-4x text-muted mb-3"></i>
                <h4 class="text-muted">Hiện chưa có bác sĩ nào trực tuyến.</h4>
            </div>
        </div>
    </div>
</body>

</html>
